# ===========================
# Application Configuration
# ===========================
spring.application.name=InternConnect
server.port=${PORT:8080}

# ===========================
# MySQL Database Configuration
# ===========================
# Handles both local JDBC URL and Railway's dynamic MySQL URL/credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate Configuration
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# ===========================
jwt.secret=${JWT_SECRET:internconnect-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000

# ===========================
# Logging
# ===========================
logging.level.com.internconnect=DEBUG
logging.level.org.springframework.security=INFO

# ===========================
# Multipart Uploads
# ===========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB